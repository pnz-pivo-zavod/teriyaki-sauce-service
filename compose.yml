# Локальный стенд: Postgres + API из исходников. Для фронта — Go и Postgres ставить не нужно.
#   docker compose up --build        # API: http://localhost:8080, документация: /docs
#   docker compose down              # остановить (данные сохранятся)
#   docker compose down -v           # остановить и стереть базу
# Авторизация отключена (DEV_USER_ID) — Telegram и initData не нужны.
# Прод устроен иначе — см. deploy/.
name: teriyaki-local

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: teriyaki
    volumes:
      - pgdata:/var/lib/postgresql # с 18-й версии данные в подкаталоге /var/lib/postgresql/18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teriyaki"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/teriyaki?sslmode=disable
      DEV_USER_ID: "1"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
